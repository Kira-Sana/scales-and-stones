  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('blog-container');
      const posts = window.BLOG_POSTS || [];

      function renderFeed() {
        const cards = posts.map(post => `
          <article class="blog-card" data-post-id="${post.id}">
            <div class="blog-meta">
              <span>${post.date}</span>
              <span>&middot;</span>
              <span>${post.category}</span>
            </div>
            <h2>${post.title}</h2>
            <p>${post.excerpt}</p>
            <span class="blog-read-link">Read Entry &rarr;</span>
          </article>
        `).join('');

        container.innerHTML = `<div class="blog-grid">${cards}</div>`;

        container.querySelectorAll('.blog-card').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.getAttribute('data-post-id');
            window.location.hash = id;
          });
        });
      }

      function renderPost(post) {
        const paragraphs = post.content.map(p => `<p>${p}</p>`).join('');
        container.innerHTML = `
          <article class="blog-article-view">
            <div style="margin-bottom: 1.8rem;">
              <button type="button" class="btn-gothic outline" id="back-to-blog" style="padding: 0.55rem 1.4rem; font-size: 0.7rem;">
                &larr; All Journal Entries
              </button>
            </div>
            <div class="blog-meta">
              <span>${post.date}</span>
              <span>&middot;</span>
              <span>${post.category}</span>
              <span>&middot;</span>
              <span>${post.author}</span>
            </div>
            <h2 class="section-title" style="text-align: left; margin-bottom: 1.5rem;">${post.title}</h2>
            ${paragraphs}
          </article>
        `;

        document.getElementById('back-to-blog').addEventListener('click', () => {
          history.pushState('', document.title, window.location.pathname + window.location.search);
          renderFeed();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      function handleRoute() {
        const hashId = window.location.hash.replace('#', '');
        const found = posts.find(p => p.id === hashId);
        if (found) {
          renderPost(found);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          renderFeed();
        }
      }

      window.addEventListener('hashchange', handleRoute);
      handleRoute();
    });
  </script>
